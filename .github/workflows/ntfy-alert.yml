name: Ntfy Alert

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed]
  release:
    types: [published]
  issues:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          [ -z "$NTFY_TOPIC" ] && echo "No NTFY_TOPIC secret, skipping" && exit 0

          AUTH_FLAG=""
          [ -n "$NTFY_TOKEN" ] && AUTH_FLAG="-u :$NTFY_TOKEN"

          build_msg() {
            local title="" body="" tags="" prio="default"

            case "$EVENT" in
              push)
                title="🔀 Push → $REPO"
                body="$ACTOR → $REF"
                [ -n "$COMMIT_MSG" ] && body="$body
          $(echo "$COMMIT_MSG" | head -1)"
                tags="heavy_check_mark"
                ;;
              pull_request)
                title="🔃 PR $ACTION → $REPO"
                body="#$PR_NUM: $PR_TITLE
          by $ACTOR"
                tags="pull_request"
                [ "$ACTION" = "closed" ] && tags="heavy_check_mark" && prio="low"
                ;;
              release)
                title="📦 Release $ACTION → $REPO"
                body="$RELEASE_TAG: $RELEASE_NAME"
                tags="package"
                ;;
              issues)
                title="🚩 Issue $ACTION → $REPO"
                body="#$ISSUE_NUM: $ISSUE_TITLE
          by $ACTOR"
                tags="triangular_flag_on_post"
                ;;
              *)
                title="📢 $EVENT → $REPO"
                body="$ACTOR triggered $EVENT"
                tags="loudspeaker"
                ;;
            esac

            curl -sf $AUTH_FLAG \
              -H "Title: $title" \
              -H "Tags: $tags" \
              -H "Priority: $prio" \
              --data-raw "$body" \
              "https://ntfy.sh/$NTFY_TOPIC"
          }

          build_msg
